name: Build and Publish Images

on:
  push:
  workflow_dispatch:
    inputs:
      push_images:
        type: boolean
        default: false

env:
  ALPINE_VERSION: 3.24
  REGISTRY: nucleus61bfb23a

jobs:
  apko:
    runs-on: ubuntu-latest
    permissions:
      packages: write
      security-events: write
    steps:
    - name: Checkout project
      uses: actions/checkout@v6
    
    - name: Login to Azure
      uses: azure/login@v3
      if: ${{ inputs.push_images == true }}
      with:
        tenant-id: ${{ secrets.AZURE_TENANT_ID }}
        subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
        client-id: ${{ secrets.AZURE_CLIENT_ID }}

    - name: Login to Azure Container Registry
      if: ${{ inputs.push_images == true }}
      run: az acr login --name ${REGISTRY}

    - name: Template Alpine version
      run: envsubst < ./apko/jlink.yml > ./apko/jlink.yml

    - name: Build JLink
      uses: docker://cgr.dev/chainguard/apko
      with:
        args: >
          ${{ inputs.push_images && 'publish' || 'build' }} ./apko/jlink.yml
          ${REGISTRY}/alpine:${ALPINE_VERSION}-jlink
          ${{ inputs.push_images == false && 'image.tar' }}
